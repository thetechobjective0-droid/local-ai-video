[project]
name = "local-ai-video"
version = "0.1.0"
description = "Local-first AI video generation pipeline for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<0.7",
    "mypy>=1.10,<2.0",
]
image = [
    "diffusers>=0.35,<1.0",
    "pillow>=10.0,<12.0",
    "safetensors>=0.4,<1.0",
    "torch>=2.4,<3.0",
    "transformers>=4.45,<5.0",
]

[project.scripts]
video-agent = "app.cli:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
