runtime:
  profile: balanced
  max_concurrent_media_jobs: 1
  local_only: true

llm:
  provider: ollama
  model: qwen2.5-coder:32b
  temperature: 0.2
  top_p: 0.9
  top_k: 40

image:
  provider: diffusers
  model_path: ./data/models/stable-diffusion-xl-base-1.0
  device: mps
  width: 1024
  height: 576
  steps: 30
  guidance_scale: 7.0

tts:
  provider: macos_say
  voice: null
  rate: 180
  sample_rate: 22050

video:
  provider: ffmpeg_ken_burns
  device: mps
  dtype: float16
  width: 704
  height: 384
  fps: 16
  # For real local AI I2V, use a downloaded LTX-Video checkpoint:
  # provider: ltx_video
  # model_path: ./data/models/LTX-Video

storage:
  root: ./data
