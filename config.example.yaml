runtime:
  profile: quality
  max_concurrent_media_jobs: 1
  local_only: true

llm:
  provider: ollama
  model: qwen2.5-coder:32b
  temperature: 0.2
  top_p: 0.9
  top_k: 40

image:
  provider: diffusers
  model_path: ./data/models/stable-diffusion-xl-base-1.0
  device: mps
  width: 1024
  height: 576
  steps: 35
  guidance_scale: 7.0

tts:
  provider: macos_say
  voice: null
  rate: 180
  sample_rate: 22050

video:
  # Use real local AI image-to-video for high-quality motion.
  provider: ltx_video
  model_path: ./data/models/LTX-Video
  device: mps
  dtype: float16
  width: 704
  height: 480
  fps: 24
  inference_steps: 40
  guidance_scale: 3.0
  guidance_rescale: 0.0
  image_cond_noise_scale: 0.025
  decode_timestep: 0.05
  decode_noise_scale: 0.025
  # Deterministic FFmpeg motion remains available as a fallback.
  # provider: ffmpeg_ken_burns

storage:
  root: ./data
