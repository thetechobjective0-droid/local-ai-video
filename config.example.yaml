runtime:
  profile: quality
  max_concurrent_media_jobs: 1
  local_only: true

llm:
  provider: ollama
  model: qwen2.5-coder:32b
  temperature: 0.2
  top_p: 0.9
  top_k: 40

image:
  provider: diffusers
  model_path: ./data/models/stable-diffusion-xl-base-1.0
  device: mps
  width: 1024
  height: 576
  steps: 35
  guidance_scale: 7.0

tts:
  provider: macos_say
  voice: null
  rate: 180
  sample_rate: 22050

video:
  # Real temporal AI video + synchronized native audio on Apple Silicon.
  provider: ltx2_mlx
  engine_path: ./data/runtime/ltx-video-mlx
  uv_command: uv
  bits: 8
  native_audio: true
  i2v_strength: 0.95
  allow_fallback: false
  width: 768
  height: 512
  fps: 25
  # LTX-2 MLX uses an 8-step distilled runtime; the remaining fields are
  # retained for compatibility with the PyTorch LTX-Video provider.
  inference_steps: 8
  guidance_scale: 1.0
  guidance_rescale: 0.0
  image_cond_noise_scale: 0.025
  decode_timestep: 0.05
  decode_noise_scale: 0.025
  # Explicit alternatives:
  # provider: ltx_video
  # model_path: ./data/models/LTX-Video
  # provider: ffmpeg_ken_burns

storage:
  root: ./data
